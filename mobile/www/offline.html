<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sem ligação — Natur Erva</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #ffffff; color: #414552; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .card { max-width: 320px; }
    img { width: 64px; height: auto; margin-bottom: 24px; }
    h1 { font-size: 20px; margin: 0 0 8px; color: #1f2937; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 24px; color: #697386; }
    button {
      width: 100%; height: 48px; border: 0; border-radius: 999px; background: #16a34a; color: #fff;
      font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:active { background: #15803d; }
    small { display: block; margin-top: 16px; font-size: 12px; color: #9aa3b2; }
  </style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="Natur Erva" />
    <h1>Sem ligação à internet</h1>
    <p>Verifique os dados móveis ou o Wi-Fi e tente novamente.</p>
    <button id="retry">Tentar novamente</button>
    <small>A app volta a abrir sozinha quando a ligação regressar.</small>
  </div>
  <script>
    var SITE = 'https://www.natur-erva.co.mz';
    function retry() { window.location.replace(SITE); }
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
